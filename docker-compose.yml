# Two services from one image: the read-only dashboard and the live
# trading loop. Both write into ./logs and ./checkpoints on the host via
# bind mounts, so decisions.jsonl, model checkpoints, and risk/drift state
# persist across container restarts and stay visible outside Docker.
#
# Usage:
#   docker compose build
#   docker compose up dashboard                 # http://localhost:8787
#   cp .env.example .env && <fill in your paper keys>
#   docker compose up live-trader
#
# Secrets (ALPACA_API_KEY / ALPACA_SECRET_KEY) are never baked into the
# image -- live-trader reads them from ./.env at `up` time via env_file.
# The dashboard needs no credentials; it only ever reads logs/checkpoints.

services:
  dashboard:
    build: .
    image: neural-trader:latest
    container_name: neural-trader-dashboard
    # Output is tee'd into logs/<script>_stdout.log -- the same files
    # premarket_check.py's start_script() writes on the host -- so the
    # dashboard's Logs page keeps updating. Without this it only goes to
    # `docker logs` and those files go stale. pipefail keeps python's
    # exit status (not tee's) so `restart: unless-stopped` still sees a crash.
    command: ["bash", "-c", "set -o pipefail; python -u scripts/serve_dashboard.py --host 0.0.0.0 --port 8787 --no-open 2>&1 | tee -a logs/serve_dashboard_stdout.log"]
    ports:
      - "8787:8787"
    volumes:
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
      - ./config.yaml:/app/config.yaml:ro
      # Mounted (read-only) so dashboard.html edits show up on a browser
      # reload -- serve_dashboard.py re-reads it on every GET /, so no
      # rebuild or restart is needed.
      - ./dashboard.html:/app/dashboard.html:ro
    restart: unless-stopped

  live-trader:
    build: .
    image: neural-trader:latest
    container_name: neural-trader-live
    # See the dashboard service's comment on why this is tee'd.
    command: ["bash", "-c", "set -o pipefail; python -u scripts/run_live_alpaca.py 2>&1 | tee -a logs/run_live_alpaca_stdout.log"]
    env_file:
      - .env
    # Alpaca's free data plan allows one websocket per login, so this bot
    # owns it and writes every bar to the shared-bars volume for the
    # experiment arms (a Docker volume, not a Windows folder, so appends
    # show up in the other containers right away).
    environment:
      NT_BAR_PUBLISH_PATH: /app/shared-bars/bars.jsonl
    volumes:
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
      - ./config.yaml:/app/config.yaml:ro
      - shared-bars:/app/shared-bars
    restart: unless-stopped

  # Label-horizon paper experiment (experiments/label-horizon/README.md).
  # Two arms that differ only in label.horizon (15 vs 30 bars), each on its
  # OWN Alpaca paper account so neither adopts the other's (or the live
  # trader's) positions at startup. Off by default; start one with:
  #   docker compose up -d paper-h30
  paper-h15:
    build: .
    image: neural-trader:latest
    container_name: neural-trader-paper-h15
    profiles: ["experiment"]
    command: ["bash", "-c", "set -o pipefail; python -u scripts/run_live_alpaca.py 2>&1 | tee -a logs/run_live_alpaca_stdout.log"]
    env_file:
      - path: .paper-h15.env
        required: false  # only the arms you have an account for need one
    # Reads live-trader's bars instead of opening a second websocket.
    environment:
      NT_BAR_SOURCE_PATH: /app/shared-bars/bars.jsonl
    volumes:
      - shared-bars:/app/shared-bars:ro
      - ./experiments/label-horizon/h15/logs:/app/logs
      - ./experiments/label-horizon/h15/checkpoints:/app/checkpoints
      - ./experiments/label-horizon/config-h15.yaml:/app/config.yaml:ro
    restart: unless-stopped

  paper-h30:
    build: .
    image: neural-trader:latest
    container_name: neural-trader-paper-h30
    profiles: ["experiment"]
    command: ["bash", "-c", "set -o pipefail; python -u scripts/run_live_alpaca.py 2>&1 | tee -a logs/run_live_alpaca_stdout.log"]
    env_file:
      - path: .paper-h30.env
        required: false  # only the arms you have an account for need one
    # Reads live-trader's bars instead of opening a second websocket.
    environment:
      NT_BAR_SOURCE_PATH: /app/shared-bars/bars.jsonl
    volumes:
      - shared-bars:/app/shared-bars:ro
      - ./experiments/label-horizon/h30/logs:/app/logs
      - ./experiments/label-horizon/h30/checkpoints:/app/checkpoints
      - ./experiments/label-horizon/config-h30.yaml:/app/config.yaml:ro
    restart: unless-stopped

volumes:
  shared-bars:
