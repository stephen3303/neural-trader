# Two services from one image: the read-only dashboard and the live
# trading loop. Both write into ./logs and ./checkpoints on the host via
# bind mounts, so decisions.jsonl, model checkpoints, and risk/drift state
# persist across container restarts and stay visible outside Docker.
#
# Usage:
#   docker compose build
#   docker compose up dashboard                 # http://localhost:8787
#   cp .env.example .env && <fill in your paper keys>
#   docker compose up live-trader
#
# Secrets (ALPACA_API_KEY / ALPACA_SECRET_KEY) are never baked into the
# image -- live-trader reads them from ./.env at `up` time via env_file.
# The dashboard needs no credentials; it only ever reads logs/checkpoints.

services:
  dashboard:
    build: .
    image: neural-trader:latest
    container_name: neural-trader-dashboard
    # Output is tee'd into logs/<script>_stdout.log -- the same files
    # premarket_check.py's start_script() writes on the host -- so the
    # dashboard's Logs page keeps updating. Without this it only goes to
    # `docker logs` and those files go stale. pipefail keeps python's
    # exit status (not tee's) so `restart: unless-stopped` still sees a crash.
    command: ["bash", "-c", "set -o pipefail; python -u scripts/serve_dashboard.py --host 0.0.0.0 --port 8787 --no-open 2>&1 | tee -a logs/serve_dashboard_stdout.log"]
    ports:
      - "8787:8787"
    volumes:
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  live-trader:
    build: .
    image: neural-trader:latest
    container_name: neural-trader-live
    # See the dashboard service's comment on why this is tee'd.
    command: ["bash", "-c", "set -o pipefail; python -u scripts/run_live_alpaca.py 2>&1 | tee -a logs/run_live_alpaca_stdout.log"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
