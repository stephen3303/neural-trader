name: tests

# Runs the test suite on every push and pull request. This only checks that
# the scaffold's logic (model, risk, features, trainer, orchestrator, order
# book, etc.) is correct via src/ + tests/ -- it never touches a real
# brokerage account, since the tests use SyntheticFeed/PaperBroker and the
# one Alpaca test (test_alpaca_broker.py) only checks that construction
# refuses paper=False, with no network calls or real credentials involved.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel: much smaller/faster to install in CI than
          # the default (which may pull CUDA builds), and this project's
          # tests never need a GPU.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
